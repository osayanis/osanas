# OsaNAS — seconde instance du lighttpd 1.4.28 du firmware, port 8080.
server.modules = ( "mod_access", "mod_fastcgi", "mod_expire" )

server.document-root = "/mnt/HD/HD_a2/.osanas/www"
server.port          = 8080
server.username      = "nobody"
server.pid-file      = "/var/run/osanas-lighttpd.pid"
server.errorlog      = "/mnt/HD/HD_a2/.osanas/log/lighttpd.log"
server.upload-dirs   = ( "/mnt/HD/HD_a2/.osanas/tmp" )
server.max-request-size = 2097152
server.max-write-idle   = 600
server.max-read-idle    = 600
server.tag           = "OsaNAS"

index-file.names = ( "index.html" )
url.access-deny  = ( "~", ".inc", ".ini", ".sh", ".conf" )

mimetype.assign = (
  ".html" => "text/html; charset=utf-8",
  ".css"  => "text/css; charset=utf-8",
  ".js"   => "application/javascript; charset=utf-8",
  ".svg"  => "image/svg+xml",
  ".png"  => "image/png",
  ".webmanifest" => "application/manifest+json",
  ".json" => "application/json"
)

$HTTP["url"] =~ "\.(css|js|svg|png)$" {
  expire.url = ( "" => "access plus 1 hours" )
}

# PHP : un seul process maître, 2 enfants (128 Mo de RAM au total sur la machine).
# upload_tmp_dir sur le disque (même volume que la destination : le déplacement final est instantané).
fastcgi.server = ( ".php" => ((
  "bin-path"  => "/usr/bin/php-cgi -d upload_tmp_dir=/mnt/HD/HD_a2/.osanas/tmp -d session.save_path=/tmp/osanas-sess -d max_execution_time=0 -d memory_limit=32M -d display_errors=0 -d log_errors=1 -d error_log=/mnt/HD/HD_a2/.osanas/log/php.log",
  "socket"    => "/tmp/osanas-php.sock",
  "max-procs" => 1,
  "bin-environment" => ( "PHP_FCGI_CHILDREN" => "2", "PHP_FCGI_MAX_REQUESTS" => "500" ),
  "bin-copy-environment" => ( "PATH" ),
  "allow-x-send-file" => "enable",
  "broken-scriptfilename" => "enable"
)))
